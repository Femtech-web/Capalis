<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="840" viewBox="0 0 2560 840">
  <defs>
    <radialGradient id="glow" cx="30%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#16233d"/>
      <stop offset="55%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1b2740"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="2560" height="840" fill="url(#glow)"/>
  <rect width="2560" height="840" fill="url(#dots)" opacity="0.7"/>
  <rect x="60" y="56" width="2440" height="728" rx="28" fill="none" stroke="#1c2a45" stroke-width="2"/>

  <!-- Wordmark -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="150" y="214" font-size="30" letter-spacing="9" fill="#7dd3fc" font-weight="600">VERIFIED RECIPES FOR HERMES AGENT</text>

    <circle cx="232" cy="356" r="86" fill="url(#mark)" opacity="0.35" filter="url(#soft)"/>
    <rect x="150" y="272" width="166" height="166" rx="40" fill="#0b1020" stroke="url(#mark)" stroke-width="6"/>
    <path d="M 268 318 A 52 52 0 1 0 268 394" fill="none" stroke="#e2e8f0" stroke-width="17" stroke-linecap="round"/>
    <path d="M 214 357 L 236 379 L 284 327" fill="none" stroke="#34d399" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="356" y="412" font-size="158" font-weight="800" fill="#f8fafc" letter-spacing="-4">Capalis</text>
    <text x="150" y="548" font-size="62" font-weight="600" fill="#e2e8f0">Agents that prove they're done.</text>
    <text x="150" y="616" font-size="34" fill="#94a3b8">Describe a workflow once. Approve it once. Every step it takes</text>
    <text x="150" y="662" font-size="34" fill="#94a3b8">is checked by reading the result back from where it landed.</text>
  </g>

  <!-- Run card -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace">
    <rect x="1380" y="150" width="1040" height="570" rx="26" fill="url(#card)" stroke="#22324f" stroke-width="2"/>
    <text x="1430" y="222" font-size="30" fill="#94a3b8">run 75415396  ·  bug-reports  ·  live</text>
    <rect x="2178" y="186" width="196" height="50" rx="25" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="2276" y="221" font-size="26" font-weight="700" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">VERIFIED</text>
    <line x1="1430" y1="256" x2="2370" y2="256" stroke="#1e2b45" stroke-width="2"/>

    <g font-size="30">
      <circle cx="1452" cy="302" r="15" fill="none" stroke="#7dd3fc" stroke-width="4"/>
      <text x="1490" y="313" fill="#e2e8f0">report in Discord #bugs</text>
      <text x="2370" y="313" fill="#64748b" text-anchor="end">trigger</text>
      <circle cx="1452" cy="370" r="15" fill="#34d399"/>
      <path d="M 1444 370 L 1450 376 L 1461 364" fill="none" stroke="#052e2b" stroke-width="4" stroke-linecap="round"/>
      <text x="1490" y="381" fill="#e2e8f0">issue #5 opened in GitHub</text>
      <text x="2370" y="381" fill="#6ee7b7" text-anchor="end">read back · V1 met</text>
      <circle cx="1452" cy="438" r="15" fill="#34d399"/>
      <path d="M 1444 438 L 1450 444 L 1461 432" fill="none" stroke="#052e2b" stroke-width="4" stroke-linecap="round"/>
      <text x="1490" y="449" fill="#e2e8f0">#engineering told in Slack</text>
      <text x="2370" y="449" fill="#6ee7b7" text-anchor="end">read back · V1 met</text>
      <circle cx="1452" cy="506" r="15" fill="#34d399"/>
      <path d="M 1444 506 L 1450 512 L 1461 500" fill="none" stroke="#052e2b" stroke-width="4" stroke-linecap="round"/>
      <text x="1490" y="517" fill="#e2e8f0">reporter thanked in Discord</text>
      <text x="2370" y="517" fill="#6ee7b7" text-anchor="end">read back · V1 met</text>
      <circle cx="1452" cy="574" r="15" fill="#34d399"/>
      <path d="M 1444 574 L 1450 580 L 1461 568" fill="none" stroke="#052e2b" stroke-width="4" stroke-linecap="round"/>
      <text x="1490" y="585" fill="#e2e8f0">fixed → reporter told</text>
      <text x="2370" y="585" fill="#6ee7b7" text-anchor="end">read back · V1 met</text>
    </g>

    <line x1="1430" y1="628" x2="2370" y2="628" stroke="#1e2b45" stroke-width="2"/>
    <text x="1430" y="680" font-size="27" fill="#64748b">approved by the owner  ·  no duplicates  ·  no blind retries</text>
  </g>

  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="25" letter-spacing="6">
    <text x="150" y="752" fill="#64748b">GITHUB  ·  SLACK  ·  DISCORD</text>
    <text x="2410" y="752" fill="#64748b" text-anchor="end">HERMES AGENT PLUGIN  ·  2026</text>
  </g>
</svg>
