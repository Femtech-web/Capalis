[project]
name = "capalis"
version = "0.1.0"
description = "Capability intelligence and Verified Recipes for Hermes Agent"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "hypothesis>=6.112,<7",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pytest-cov>=5,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "e2e: real provider sandbox tests; opt-in via CAPALIS_E2E=1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["plugin", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "plugin"
packages = ["capalis"]

[[tool.mypy.overrides]]
# Provided by the Hermes runtime, not installed in the dev environment.
module = ["agent.*", "plugins.*", "certifi"]
ignore_missing_imports = true
