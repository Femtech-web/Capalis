# Draft entry for plugin-catalog/capalis.yaml in NousResearch/hermes-agent.
# Before opening the PR: make the repository public, then pin sha to the full 40-character commit you push.
name: capalis
repo: https://github.com/Femtech-web/Capalis
sha: <40-character commit sha>
subdir: plugin
description: >-
  Your AI agent says "done"; Capalis makes it prove it. Describe a workflow in chat (e.g. Discord or Slack bug
  report -> GitHub issue -> Slack notice -> reply to the reporter when it's closed, or a scheduled site watch).
  Capalis compiles it into a scoped, versioned Recipe, shadow-runs it, and runs it only after the owner approves
  that exact version (/capalis approve, with a button). It verifies every write by independent read-back,
  never blindly retries an uncertain write, and quarantines the Recipe when a dependency changes. Other
  Hermes tools can join as read steps under owner-tested, owner-approved contracts. Disclosure: calls
  api.github.com, slack.com, discord.com and api.telegram.org (and a Slack webhook if configured) with the user's tokens, and
  credential-free HTTPS GETs to origins an approved Recipe names; calls other Hermes tools via
  ctx.dispatch_tool only under approved read-only contracts; stores Recipes, approvals and redacted run records
  in plugin-data/capalis/ (evidence exports in plugin-data/capalis/exports/); consumes chat messages in channels
  a Recipe listens to (pre_gateway_dispatch) and sends owner alerts and approval requests to a channel the owner sets (Telegram, Slack or Discord); runs a daemon
  thread in the gateway every 30 s. No shell commands, subprocesses, telemetry or self-updating.
maintainer: Femtech-web
tier: community
category: automation
docs_url: https://github.com/Femtech-web/Capalis#readme
version: "0.2.0"
platforms: []
capabilities:
  provides_tools: [capalis_status, capalis_setup, capalis_capabilities, capalis_recipe, capalis_run, capalis_contract, capalis_pause]
  provides_hooks: [pre_gateway_dispatch]
  provides_middleware: []
  requires_env: []
